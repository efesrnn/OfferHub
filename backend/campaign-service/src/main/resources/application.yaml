spring:
  application:
    name: campaign-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/campaign}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# Campaign calls AI when a campaign is created. Unreachable is a supported state, not
# an error - see AiClient.
ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8083}
  auto-assign:
    # Off leaves every new case for a supervisor to assign by hand.
    enabled: ${AI_AUTO_ASSIGN:true}
  # AI names experts EXP-001 while Identity issues UUIDs. Map them here and automatic
  # assignment lands on real staff accounts; leave it empty and AI's proposals are logged
  # and ignored, so cases wait for a supervisor instead of parking on a placeholder.
  # Format: EXP-001=<uuid>,EXP-002=<uuid>
  expert-mapping: ${AI_EXPERT_MAPPING:}

# Case document 5.4: hours in production, minutes during a demo so an SLA breach
# can actually be shown.
sla:
  time-unit: ${SLA_TIME_UNIT:hours}
  # How often the breach scan runs. Shorten it alongside time-unit for a demo.
  scan-interval-ms: ${SLA_SCAN_INTERVAL_MS:30000}

server:
  port: 8080
